<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/screenshots/topology.png' | absolute_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css">
  <style>
    :root { --bar-bg:#f6f8fa; --bar-border:#d1d9e0; --text:#1f2328; --muted:#59636e; --btn-bg:#f6f8fa; --btn-border:#d1d9e0; --page:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bar-bg:#010409; --bar-border:#3d444d; --text:#f0f6fc; --muted:#9198a1; --btn-bg:#212830; --btn-border:#3d444d; --page:#0d1117; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--page); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; }
    .topbar { background:var(--bar-bg); border-bottom:1px solid var(--bar-border); }
    .topbar-inner { max-width:1012px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .crumb { display:flex; align-items:center; gap:8px; font-size:16px; min-width:0; }
    .crumb svg { flex:none; fill:var(--text); }
    .crumb a { color:var(--text); text-decoration:none; }
    .crumb a:hover { text-decoration:underline; }
    .crumb .repo { font-weight:600; }
    .crumb .sep { color:var(--muted); }
    .pill { font-size:12px; font-weight:500; color:var(--muted); border:1px solid var(--bar-border); border-radius:999px; padding:0 7px; line-height:18px; }
    .spacer { flex:1; }
    .btn { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--text); text-decoration:none;
      background:var(--btn-bg); border:1px solid var(--btn-border); border-radius:6px; padding:5px 12px; line-height:20px; }
    .btn:hover { filter:brightness(0.97); }
    .btn svg { fill:currentColor; }
    .nav { max-width:1012px; margin:0 auto; padding:0 16px; display:flex; gap:4px; }
    .nav a { font-size:14px; color:var(--text); text-decoration:none; padding:8px 10px 10px; border-bottom:2px solid transparent; }
    .nav a.active { border-bottom-color:#fd8c73; font-weight:600; }
    .nav a:hover { color:var(--text); background:rgba(129,139,152,.12); border-radius:6px 6px 0 0; }
    .wrap { max-width:1012px; margin:24px auto; padding:0 16px; }
    .markdown-body { border:1px solid var(--bar-border); border-radius:6px; padding:32px 40px; }
    .markdown-body img { background:transparent; }
    footer { max-width:1012px; margin:0 auto 40px; padding:0 16px; font-size:12px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; }
    footer a { color:var(--muted); }
    @media (max-width:767px) { .markdown-body { padding:16px; border:0; } .wrap { padding:0 8px; } }
  </style>
</head>
<body>
  {% assign repo_url = "https://github.com/smith713/small-office-network-lab" %}
  <header class="topbar">
    <div class="topbar-inner">
      <div class="crumb">
        <svg height="20" viewBox="0 0 16 16" width="20" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>
        <a href="https://github.com/smith713">smith713</a>
        <span class="sep">/</span>
        <a class="repo" href="{{ '/' | relative_url }}">small-office-network-lab</a>
        <span class="pill">Public</span>
      </div>
      <div class="spacer"></div>
      <a class="btn" href="https://latoyyasmith.com">latoyyasmith.com</a>
      <a class="btn" href="{{ repo_url }}">
        <svg height="16" viewBox="0 0 16 16" width="16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.030-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        View on GitHub
      </a>
    </div>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>Overview</a>
      <a href="{{ '/TROUBLESHOOTING.html' | relative_url }}" {% if page.url contains "TROUBLESHOOTING" %}class="active"{% endif %}>Troubleshooting</a>
      <a href="https://smith713.github.io/azure-office-extension/">Part 2: Azure</a>
      <a href="{{ repo_url }}/tree/main">Files</a>
    </nav>
  </header>
  <main class="wrap">
    <article class="markdown-body">
      {{ content }}
    </article>
  </main>
  <footer>
    <span>© {{ site.time | date: "%Y" }} Latoyya Smith</span>
    <a href="{{ repo_url }}">Source on GitHub</a>
    <a href="https://latoyyasmith.com">latoyyasmith.com</a>
  </footer>
</body>
</html>
